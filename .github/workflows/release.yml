# Publish to npm when a version tag is pushed.
#
#   npm version 0.2.0        # bumps package.json, commits, tags v0.2.0
#   git push --follow-tags   # this workflow builds the dashboard (prepack) and publishes
#
# Needs an NPM_TOKEN secret (an automation token for the @amenophis1er scope)
# in the repository settings. The tag must match package.json's version.
name: release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release with the tarball
        run: |
          npm pack
          gh release create "${GITHUB_REF_NAME}" ./*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
