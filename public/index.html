<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman — spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui; background: #14161a; color: #e6e3da; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #1c1f24; border-bottom: 1px solid #2c313a; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; color: #e8b04b; }
  input, textarea, button { font: inherit; background: #23272e; color: inherit; border: 1px solid #3a4048; border-radius: 6px; padding: 6px 9px; }
  #folder { width: 320px; } #mission { width: 420px; height: 34px; resize: vertical; }
  button { cursor: pointer; } button:hover { border-color: #e8b04b; }
  button.primary { background: #e8b04b; color: #14161a; font-weight: 600; border-color: #e8b04b; }
  #meta { margin-left: auto; font-size: 12px; color: #9aa3ad; display: flex; gap: 14px; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 62px); }
  #transcript { overflow-y: auto; padding: 14px; }
  #sidebar { border-left: 1px solid #2c313a; padding: 12px; overflow-y: auto; background: #181b1f; }
  #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9aa3ad; margin: 0 0 10px; }
  .entry { margin-bottom: 10px; padding: 8px 10px; border-radius: 8px; background: #1c1f24; border: 1px solid #262b32; white-space: pre-wrap; word-break: break-word; }
  .entry .tag { font-size: 11px; color: #9aa3ad; margin-bottom: 3px; }
  .entry.assistant { border-left: 3px solid #e8b04b; }
  .entry.worker { border-left: 3px solid #7a5bd6; }
  .entry.tool { border-left: 3px solid #5b8dd6; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .entry.system { color: #9aa3ad; font-size: 12.5px; }
  .entry.error { border-left: 3px solid #d65b5b; }
  .card { background: #23272e; border: 1px solid #e8b04b; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .card .tool-name { font-weight: 600; color: #e8b04b; }
  .card pre { background: #14161a; padding: 6px; border-radius: 6px; overflow-x: auto; font-size: 11.5px; max-height: 160px; }
  .card .actions { display: flex; gap: 8px; margin-top: 8px; }
  .card button.allow { background: #3f7a4b; border-color: #3f7a4b; }
  .card button.deny { background: #7a3f3f; border-color: #7a3f3f; }
  .empty { color: #6b7280; font-size: 12.5px; }
  #picker { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #picker.open { display: flex; }
  #picker .panel { width: 480px; max-height: 70vh; display: flex; flex-direction: column; background: #1c1f24; border: 1px solid #3a4048; border-radius: 10px; overflow: hidden; }
  #picker .path { padding: 10px 12px; font: 12px ui-monospace, monospace; color: #e8b04b; background: #181b1f; border-bottom: 1px solid #2c313a; word-break: break-all; }
  #picker .list { overflow-y: auto; flex: 1; }
  #picker .list button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 0; padding: 7px 12px; color: #e6e3da; }
  #picker .list button:hover { background: #23272e; }
  #picker .foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #2c313a; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>Foreman</h1>
  <input id="folder" placeholder="/absolute/path/to/folder">
  <button id="browse" title="Browse folders">📁</button>
  <textarea id="mission" placeholder="Mission…"></textarea>
  <input id="budget" type="number" min="1" step="1" value="5" title="Budget cap (USD)" style="width:70px">$
  <button class="primary" id="start">Start</button>
  <button id="interrupt">Interrupt</button>
  <div id="meta"><span id="status">idle</span><span id="cost"></span><span id="session"></span></div>
</header>
<main>
  <div id="transcript"></div>
  <div id="sidebar">
    <h2>Approvals</h2>
    <div id="cards"><div class="empty">No pending approvals.</div></div>
    <h2 style="margin-top:16px">Questions</h2>
    <div id="questions"><div class="empty">No questions from the director.</div></div>
    <h2 style="margin-top:16px">Mission doc</h2>
    <pre id="missiondoc" style="font-size:11px;white-space:pre-wrap;color:#b8bec6;background:#14161a;border-radius:8px;padding:8px;max-height:300px;overflow-y:auto">—</pre>
  </div>
</main>
<div id="picker">
  <div class="panel">
    <div class="path" id="picker-path"></div>
    <div class="list" id="picker-list"></div>
    <div class="foot">
      <button id="picker-cancel">Cancel</button>
      <button class="primary" id="picker-select">Select this folder</button>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript'), cards = $('cards');

function addEntry(cls, tag, text) {
  const div = document.createElement('div');
  div.className = 'entry ' + cls;
  div.innerHTML = '<div class="tag"></div>';
  div.querySelector('.tag').textContent = tag;
  div.append(document.createTextNode(text));
  transcript.append(div);
  transcript.scrollTop = transcript.scrollHeight;
}

function renderMessage(agent, msg) {
  const who = agent || '?';
  const cls = who === 'director' ? 'assistant' : 'worker';
  if (msg.type === 'system' && msg.subtype === 'init') {
    if (who === 'director') $('session').textContent = 'director ' + (msg.session_id || '').slice(0, 8);
    addEntry('system', who + ' · init', 'model: ' + (msg.model || '?'));
  } else if (msg.type === 'assistant') {
    const blocks = msg.message?.content || msg.content || [];
    for (const b of blocks) {
      if (b.type === 'text' && b.text?.trim()) addEntry(cls, who, b.text);
      else if (b.type === 'tool_use') {
        const name = b.name.replace('mcp__foreman__', '⚙ ');
        addEntry('tool', who + ' · ' + name, JSON.stringify(b.input).slice(0, 400));
      }
    }
  } else if (msg.type === 'user') {
    const blocks = msg.message?.content;
    if (Array.isArray(blocks)) for (const b of blocks) {
      if (b.type === 'tool_result') {
        const c = typeof b.content === 'string' ? b.content
          : (b.content || []).map(x => x.text || '').join('');
        addEntry('tool', who + ' · result', String(c).slice(0, 600));
      }
    }
  } else if (msg.type === 'result') {
    addEntry(msg.is_error ? 'error' : 'system', who + ' · result: ' + (msg.subtype || ''),
      (msg.result || '').slice(0, 2000));
  }
}

function addCard(p) {
  if (cards.querySelector('.empty')) cards.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'card'; div.dataset.id = p.id;
  const title = (p.agent ? '[' + p.agent + '] ' : '') + (p.title || ('Wants to use ' + p.toolName));
  div.innerHTML = '<div class="tool-name"></div><pre></pre>' +
    '<div class="actions"><button class="allow">Allow</button>' +
    '<button class="allow always">Always (this run)</button>' +
    '<button class="deny">Deny</button></div>';
  div.querySelector('.tool-name').textContent = title;
  div.querySelector('pre').textContent = JSON.stringify(p.input, null, 2);
  div.querySelector('.allow').onclick = () => respond(p.id, 'allow');
  div.querySelector('.always').onclick = () => respond(p.id, 'allow_always');
  div.querySelector('.deny').onclick = () => respond(p.id, 'deny');
  cards.append(div);
}

function removeCard(id) {
  cards.querySelector('.card[data-id="' + CSS.escape(id) + '"]')?.remove();
  if (!cards.children.length) cards.innerHTML = '<div class="empty">No pending approvals.</div>';
}

async function respond(id, behavior) {
  await fetch('/permission', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id, behavior }) });
}

let pickerPath = null;
async function loadPicker(p) {
  const r = await fetch('/browse' + (p ? '?path=' + encodeURIComponent(p) : ''));
  const d = await r.json();
  if (!r.ok) { alert(d.error); return; }
  pickerPath = d.path;
  $('picker-path').textContent = d.path;
  const list = $('picker-list');
  list.innerHTML = '';
  if (d.parent) {
    const up = document.createElement('button');
    up.textContent = '⬑ ..';
    up.onclick = () => loadPicker(d.parent);
    list.append(up);
  }
  for (const name of d.dirs) {
    const b = document.createElement('button');
    b.textContent = '📁 ' + name;
    b.onclick = () => loadPicker(d.path + (d.path.endsWith('/') ? '' : '/') + name);
    list.append(b);
  }
  if (!d.dirs.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.style.padding = '10px 12px';
    e.textContent = 'No subfolders.';
    list.append(e);
  }
}
$('browse').onclick = () => { $('picker').classList.add('open'); loadPicker($('folder').value.trim() || null); };
$('picker-cancel').onclick = () => $('picker').classList.remove('open');
$('picker').onclick = (e) => { if (e.target === $('picker')) $('picker').classList.remove('open'); };
$('picker-select').onclick = () => {
  if (pickerPath) $('folder').value = pickerPath;
  $('picker').classList.remove('open');
};

$('start').onclick = async () => {
  transcript.innerHTML = ''; $('cost').textContent = ''; $('session').textContent = '';
  const r = await fetch('/run', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ folder: $('folder').value.trim(), mission: $('mission').value.trim(),
      budgetUsd: Number($('budget').value) }) });
  if (!r.ok) addEntry('error', 'error', (await r.json()).error);
};

function addQuestion(p) {
  const box = $('questions');
  if (box.querySelector('.empty')) box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'card'; div.dataset.id = p.id;
  div.innerHTML = '<div class="tool-name">Director asks:</div><div class="q"></div>' +
    '<textarea style="width:100%;margin-top:6px;height:52px"></textarea>' +
    '<div class="actions"><button class="allow send">Answer</button></div>';
  div.querySelector('.q').textContent = p.question;
  div.querySelector('.send').onclick = async () => {
    await fetch('/answer', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: p.id, text: div.querySelector('textarea').value }) });
  };
  box.append(div);
}
function removeQuestion(id) {
  const box = $('questions');
  box.querySelector('.card[data-id="' + CSS.escape(id) + '"]')?.remove();
  if (!box.children.length) box.innerHTML = '<div class="empty">No questions from the director.</div>';
}

let docTimer = null;
async function refreshMissionDoc() {
  const r = await fetch('/missiondoc');
  if (r.ok) {
    const d = await r.json();
    if (d.doc) $('missiondoc').textContent = d.doc;
  }
}
$('interrupt').onclick = () => fetch('/interrupt', { method: 'POST' });

const es = new EventSource('/events');
es.addEventListener('run_started', (e) => {
  const d = JSON.parse(e.data);
  $('status').textContent = 'running';
  $('cost').textContent = '$0.00 / $' + d.budgetUsd.toFixed(0);
  $('missiondoc').textContent = '—';
  clearInterval(docTimer);
  docTimer = setInterval(refreshMissionDoc, 5000);
});
es.addEventListener('cost', (e) => {
  const d = JSON.parse(e.data);
  $('cost').textContent = '$' + d.costUsd.toFixed(2) + ' / $' + d.budgetUsd.toFixed(0);
});
es.addEventListener('run_finished', (e) => {
  const d = JSON.parse(e.data);
  $('status').textContent = d.status || 'done';
  if (typeof d.costUsd === 'number') $('cost').textContent = '$' + d.costUsd.toFixed(2);
  clearInterval(docTimer);
  refreshMissionDoc();
});
es.addEventListener('run_error', (e) => addEntry('error', 'error', JSON.parse(e.data).error));
es.addEventListener('message', (e) => { const d = JSON.parse(e.data); renderMessage(d.agent, d.msg); });
es.addEventListener('worker_started', (e) => {
  const d = JSON.parse(e.data);
  addEntry('system', d.id + (d.resumed ? ' resumed' : ' spawned'), d.task);
});
es.addEventListener('worker_finished', (e) => {
  const d = JSON.parse(e.data);
  addEntry('system', d.id + ' ' + d.status, '');
});
es.addEventListener('permission_request', (e) => addCard(JSON.parse(e.data)));
es.addEventListener('permission_resolved', (e) => removeCard(JSON.parse(e.data).id));
es.addEventListener('question', (e) => addQuestion(JSON.parse(e.data)));
es.addEventListener('question_answered', (e) => removeQuestion(JSON.parse(e.data).id));
</script>
</body>
</html>
