<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App Shell" description="Foreman's project workspace chrome: header with theme toggle, read-only banner slot, and the 250 / 1fr / 340 rail grid with labelled slots." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="height:100vh;display:flex;flex-direction:column;background:#121417;color:#e8e6df;font:13px/1.45 'Source Sans 3',ui-sans-serif,system-ui,sans-serif">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.AppHeader" mode="project" title="{{ projectName }}" folder="{{ folderPath }}" theme="dark" hint-size="100%,48px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.StatusBadge" status="{{ runStatus }}" hint-size="90px,22px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.BudgetMeter" spent="1.24" budget="5" hint-size="170px,22px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Button" variant="danger" hint-size="80px,30px">Interrupt</x-import>
</x-import>
<sc-if value="{{ readOnly }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Banner" tone="readonly" hint-size="100%,26px">Viewing a past run (read-only).</x-import>
</sc-if>
<main style="flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 340px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Rail" side="left" hint-size="250px,100%">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.RunRail" current="{{ currentRun }}" agents="{{ agents }}" history="{{ history }}" selected-run-id="live" session-id="c16e338e" hint-size="100%,260px"></x-import>
</x-import>
<div style="min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px">
<div style="font-size:11px;color:#6d7683;text-transform:uppercase;letter-spacing:0.08em">Centre column — attention bar · timeline · transcript</div>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" title="init" kind="system" body="model: claude-fable-5-1" ts="{{ t0 }}" hint-size="100%,48px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" kind="text" body="Replace this entry with the page's own content." ts="{{ t1 }}" hint-size="100%,48px"></x-import>
</div>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Rail" side="right" hint-size="340px,100%">
<section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.SectionTitle" hint-size="100%,18px">Approvals</x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Empty" hint-size="100%,18px">No pending approvals.</x-import>
</section>
<section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.SectionTitle" hint-size="100%,18px">Questions</x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Empty" hint-size="100%,18px">No questions from the director.</x-import>
</section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.PlanBoard" doc="- [x] Plan the mission
- [ ] Do the work
- [ ] Verify independently" hint-size="100%,90px"></x-import>
</x-import>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760},&quot;projectName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Alpha&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;folderPath&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/Users/you/Projects/personal-foreman/scratchpad/fleet-alpha&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;runStatus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;running&quot;,&quot;done&quot;,&quot;error&quot;,&quot;interrupted&quot;],&quot;default&quot;:&quot;running&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;readOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t0 = Date.parse('2026-09-03T07:53:12');
    return {
      t0, t1: t0 + 2000,
      agents: [{ id: 'director', status: 'running' }, { id: 'worker-1', status: 'done' }],
      currentRun: { id: 'live', mission: 'Your mission brief goes here', costUsd: 1.24, status: this.props.runStatus ?? 'running', live: true, createdAt: t0 },
      history: [{ id: 'r2', mission: 'Add tests for the store reducer and verify them', createdAt: t0 - 86400000, costUsd: 2.9, status: 'done' }],
    };
  }
}
</script>
</body>
</html>
