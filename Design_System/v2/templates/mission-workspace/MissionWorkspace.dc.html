<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Mission workspace" description="A live mission in full: run + crew rail, attention bar, timeline, structured transcript, approvals / questions / plan rail." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div data-theme="{{ theme }}" style="height:100vh;display:flex;flex-direction:column;background:var(--bg-app,#121417);color:var(--ink-0,#e8e6df);font:13px/1.45 'Source Sans 3',ui-sans-serif,system-ui,sans-serif">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.AppHeader" mode="project" title="Alpha" folder="/Users/you/Projects/personal-foreman/scratchpad/fleet-alpha" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" on-settings="{{ openSettings }}" hint-size="100%,48px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.StatusBadge" status="running" hint-size="90px,22px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.BudgetMeter" spent="1.24" budget="5" hint-size="170px,22px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Button" variant="danger" hint-size="80px,30px">Interrupt</x-import>
</x-import>
<main style="flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 340px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Rail" side="left" hint-size="250px,100%">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.RunRail" current="{{ currentRun }}" agents="{{ agents }}" history="{{ history }}" selected-run-id="live" session-id="c16e338e-4b2a" hint-size="100%,320px"></x-import>
</x-import>
<div style="min-height:0;display:flex;flex-direction:column">
<div style="flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.AttentionBar" approvals="1" questions="1" hint-size="100%,34px"></x-import>
<div style="background:#1a1d22;border:1px solid #2d323b;border-radius:6px;padding:8px 10px">
<div style="font-size:11px;color:#6d7683;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Timeline</div>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.RunTimeline" agents="{{ agents }}" entries="{{ timelineEntries }}" live="{{ true }}" hint-size="100%,96px"></x-import>
</div>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" title="init" kind="system" body="model: claude-fable-5-1" ts="{{ t0 }}" hint-size="100%,48px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" kind="text" body="I'll write the mission file first, then ask you for the filename." ts="{{ t1 }}" hint-size="100%,48px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" title="Write" kind="tool" body='{"file_path":"/Users/you/Projects/personal-foreman/scratchpad/fleet-alpha/.foreman/MISSION.md","content":"# Mission\n\nAsk the human which filename to create."}' ts="{{ t2 }}" hint-size="100%,56px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" title="ask_human" kind="tool" body='{"question":"Which filename should I create in the working directory (fleet-alpha)?"}' ts="{{ t3 }}" hint-size="100%,56px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="director" title="spawn_worker" kind="tool" body='{"id":"worker-1","task":"Create hello.txt containing the word test."}' ts="{{ t4 }}" hint-size="100%,56px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="worker-1" kind="text" body="Created hello.txt containing “test”. Reporting done." ts="{{ t5 }}" hint-size="100%,48px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="worker-2" title="result" kind="error" body="Error: ENOENT: no such file or directory, open 'scratchpad/out.json'" ts="{{ t6 }}" hint-size="100%,56px"></x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.TranscriptEntry" agent="you" kind="steer" to="worker-2" timing="next" body="Don't write outside fleet-alpha. Put out.json in ./scratchpad and create the folder if it's missing." ts="{{ t7 }}" hint-size="100%,56px"></x-import>
</div>
<div style="padding:0 12px 12px">
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.SteerBar" agents="{{ agents }}" hint-size="100%,72px"></x-import>
</div>
</div>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.Rail" side="right" hint-size="340px,100%">
<section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.SectionTitle" hint-size="100%,18px">Approvals</x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.ApprovalCard" agent="worker-2" title="Wants to use Bash" decision-reason="writes outside the project folder" input="{{ approvalInput }}" hint-size="100%,200px"></x-import>
</section>
<section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.SectionTitle" hint-size="100%,18px">Questions</x-import>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.QuestionCard" question="Which filename should I create in the working directory (fleet-alpha)? The file will contain the word “test”. Please reply with the exact filename, e.g. “hello.txt”." hint-size="100%,180px"></x-import>
</section>
<x-import component-from-global-scope="ForemanDesignSystem_5f77fb.PlanBoard" doc="- [x] Ask the human for the filename (ask_human) and wait for the answer.
- [x] Spawn a worker to create the file with content “test”.
- [ ] Verify the file exists and contains “test”." hint-size="100%,110px"></x-import>
</x-import>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = { theme: 'dark' };
  renderVals() {
    const t0 = Date.parse('2026-09-03T07:53:12');
    const t = (s) => t0 + s * 1000;
    const agents = [
      { id: 'director', status: 'running' },
      { id: 'worker-1', status: 'done', task: 'Create hello.txt containing the word test.' },
      { id: 'worker-2', status: 'running', task: 'Write out.json' },
    ];
    const timelineEntries = [
      { id: 1, agent: 'director', title: 'init', kind: 'system', ts: t(0) },
      { id: 2, agent: 'director', kind: 'text', ts: t(2) },
      { id: 3, agent: 'director', title: 'Write', kind: 'tool', ts: t(6) },
      { id: 4, agent: 'director', title: 'ask_human', kind: 'tool', ts: t(11) },
      { id: 5, agent: 'director', title: 'spawn_worker', kind: 'tool', ts: t(33) },
      { id: 6, agent: 'worker-1', kind: 'text', ts: t(36) },
      { id: 7, agent: 'worker-1', title: 'Write', kind: 'tool', ts: t(41) },
      { id: 8, agent: 'worker-1', kind: 'text', ts: t(44) },
      { id: 9, agent: 'worker-2', title: 'Bash', kind: 'tool', ts: t(45) },
      { id: 10, agent: 'worker-2', title: 'result', kind: 'error', ts: t(52) },
    ];
    return {
      t0: t(0), t1: t(2), t2: t(6), t3: t(11), t4: t(33), t5: t(44), t6: t(52), t7: t(58),
      agents, timelineEntries,
      theme: this.state.theme,
      toggleTheme: () => this.setState((s) => ({ theme: s.theme === 'dark' ? 'light' : 'dark' })),
      openSettings: () => console.log('open settings'),
      currentRun: { id: 'live', mission: 'Ask me which filename to create, then have a worker create it', costUsd: 1.24, status: 'running', live: true, createdAt: t0 },
      history: [
        { id: 'r2', mission: 'Have a worker create alpha.txt containing the word test', createdAt: t0 - 86400000, costUsd: 0.68, status: 'done' },
        { id: 'r3', mission: 'Refactor the store reducer into pure functions', createdAt: t0 - 2 * 86400000, costUsd: 2.9, status: 'interrupted' },
      ],
      approvalInput: { command: 'npm run build --prefix ../shared' },
    };
  }
}
</script>
</body>
</html>
