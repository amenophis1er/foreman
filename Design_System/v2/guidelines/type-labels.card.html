<!-- @dsCard group="Type" viewport="700x140" name="Labels" subtitle="Section titles are the only uppercase text; labels sit left of their control" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:40px}h2{margin:0 0 var(--sp-2);font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--ink-2)}.lab{display:flex;align-items:center;gap:6px;color:var(--ink-1);font-size:var(--fs-sm);margin-bottom:8px}input,select{background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:6px 9px;color:var(--ink-0);font:inherit}</style>
</head><body>
<div><h2>Agents</h2><h2>Runs</h2><h2>Approvals</h2><h2>Questions</h2><h2 style="margin-bottom:0">Plan</h2></div>
<div>
<label class="lab">Budget $<input type="number" value="5" style="width:70px"></label>
<label class="lab">Director<select><option>default</option></select></label>
<label class="lab" style="margin-bottom:0">Workers<select><option>sonnet</option></select></label>
</div>
<div style="color:var(--ink-2);font-size:var(--fs-xs);max-width:200px">Section titles: 11px, 600, 0.08em tracking, muted. One or two words, never a sentence. Field labels: sentence case, no colon, secondary ink.</div>
</body></html>
