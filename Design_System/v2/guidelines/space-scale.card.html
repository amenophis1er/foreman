<!-- @dsCard group="Spacing" viewport="700x130" name="Space scale" subtitle="A 4px scale that stops at 24 — this UI is dense on purpose" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;align-items:flex-end;gap:20px}.b{background:var(--brand);height:20px;border-radius:2px}.n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);margin-top:6px}.u{font-size:var(--fs-xs);color:var(--ink-1);margin-top:2px;max-width:120px}</style>
</head><body>
<div><div class="b" style="width:var(--sp-1)"></div><div class="n">--sp-1 · 4</div><div class="u">Badge gaps, dot gaps</div></div>
<div><div class="b" style="width:var(--sp-2)"></div><div class="n">--sp-2 · 8</div><div class="u">Inside cards, button rows</div></div>
<div><div class="b" style="width:var(--sp-3)"></div><div class="n">--sp-3 · 12</div><div class="u">Card padding, rail padding</div></div>
<div><div class="b" style="width:var(--sp-4)"></div><div class="n">--sp-4 · 16</div><div class="u">Project card padding, grid gap</div></div>
<div><div class="b" style="width:var(--sp-5)"></div><div class="n">--sp-5 · 24</div><div class="u">Fleet page padding</div></div>
</body></html>
