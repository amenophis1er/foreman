<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Three text tones — text never wears identity or status color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:center;gap:12px}.sw{width:56px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);flex:0 0 auto}.n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);width:150px}</style>
</head><body>
<div class="r"><div class="sw" style="background:var(--ink-0)"></div><div class="n">--ink-0 · #e8e6df</div><div style="color:var(--ink-0);font-size:var(--fs-md)">Primary text. Mission briefs, agent prose, values.</div></div>
<div class="r"><div class="sw" style="background:var(--ink-1)"></div><div class="n">--ink-1 · #a7afb9</div><div style="color:var(--ink-1);font-size:var(--fs-md)">Secondary. Field labels, badge text, cost figures.</div></div>
<div class="r"><div class="sw" style="background:var(--ink-2)"></div><div class="n">--ink-2 · #6d7683</div><div style="color:var(--ink-2);font-size:var(--fs-md)">Muted. Section titles, paths, timestamps, empty states.</div></div>
</body></html>
