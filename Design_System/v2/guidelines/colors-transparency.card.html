<!-- @dsCard group="Colors" viewport="700x150" name="Transparency" subtitle="The system's only three non-opaque values" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sw{height:52px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm)}.n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);margin-top:6px}.u{font-size:var(--fs-xs);color:var(--ink-1);margin-top:2px}</style>
</head><body>
<div><div class="sw" style="background:var(--brand-wash);border:2px dashed var(--brand);color:var(--brand)">Drop a folder to link it</div><div class="n">--brand-wash · 6% gold</div><div class="u">Drag-to-link overlay only</div></div>
<div><div class="sw" style="background:var(--brand-wash-strong);border:1px solid var(--line)">hover wash</div><div class="n">--brand-wash-strong · 12% gold</div><div class="u">Optional hover fill on gold outlines</div></div>
<div><div class="sw" style="background:var(--scrim);border:1px solid var(--line)">modal scrim</div><div class="n">--scrim · 55% black</div><div class="u">Behind both modals. No blur anywhere in the product</div></div>
</body></html>
