<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Four escalating states, CVD-validated on dark — always paired with a glyph" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sw{height:44px;border-radius:var(--r-sm)}.n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);margin-top:6px}.u{font-size:var(--fs-xs);color:var(--ink-1);margin-top:2px}</style>
</head><body>
<div><div class="sw" style="background:var(--status-good)"></div><div class="n">--status-good · #0ca30c</div><div class="u">done · running</div></div>
<div><div class="sw" style="background:var(--status-warning)"></div><div class="n">--status-warning · #fab219</div><div class="u">needs you · 70% budget · read-only</div></div>
<div><div class="sw" style="background:var(--status-serious)"></div><div class="n">--status-serious · #ec835a</div><div class="u">interrupted · disconnected</div></div>
<div><div class="sw" style="background:var(--status-critical)"></div><div class="n">--status-critical · #d03b3b</div><div class="u">error · 90% budget · deny</div></div>
</body></html>
