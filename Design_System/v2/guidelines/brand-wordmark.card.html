<!-- @dsCard group="Brand" viewport="700x170" name="Logo" subtitle="The F mark: gold stem and top arm (director), violet middle arm (crew). Files in assets/" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:120px 1fr 1fr;gap:16px;align-items:center}.c{display:flex;align-items:center;justify-content:center;height:130px;border-radius:var(--r-md);border:1px solid var(--line);gap:12px}.w{font-size:24px;font-weight:600;letter-spacing:-0.01em}.n{font-size:var(--fs-xs);color:var(--ink-2);grid-column:1/-1}</style>
</head><body>
<div class="c" style="background:var(--bg-card)"><img src="../assets/logo.svg" width="72" height="72" alt="Foreman mark"></div>
<div class="c" style="background:var(--bg-panel)"><img src="../assets/logo.svg" width="30" height="30" alt=""><span class="w">Foreman</span><span style="color:var(--ink-2);font-size:var(--fs-sm)">mission control</span></div>
<div class="c" style="background:var(--brand);color:var(--brand-ink)"><img src="../assets/logo-mono.svg" width="30" height="30" alt="" style="filter:brightness(0)"><span class="w">Foreman</span></div>
<div class="n">Minimum size 16px. Clear space equal to the stem width on all sides. Never rotate, outline, or place on imagery. Mono version uses <code style="font-family:var(--font-mono)">currentColor</code> with the middle arm at 55% opacity.</div>
</body></html>
