<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Four stacked planes and two hairlines — depth without shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.sw{border-radius:var(--r-sm);border:1px solid var(--line);height:56px}.n{font-size:var(--fs-xs);color:var(--ink-1);font-family:var(--font-mono);margin-top:6px}.v{font-size:var(--fs-xs);color:var(--ink-2);font-family:var(--font-mono)}</style>
</head><body>
<div><div class="sw" style="background:var(--bg-app)"></div><div class="n">--bg-app</div><div class="v">#121417</div></div>
<div><div class="sw" style="background:var(--bg-panel)"></div><div class="n">--bg-panel</div><div class="v">#1a1d22</div></div>
<div><div class="sw" style="background:var(--bg-card)"></div><div class="n">--bg-card</div><div class="v">#22262d</div></div>
<div><div class="sw" style="background:var(--bg-inset)"></div><div class="n">--bg-inset</div><div class="v">#14161a</div></div>
<div><div class="sw" style="background:var(--line)"></div><div class="n">--line</div><div class="v">#2d323b</div></div>
<div><div class="sw" style="background:var(--line-strong)"></div><div class="n">--line-strong</div><div class="v">#3a4048</div></div>
</body></html>
