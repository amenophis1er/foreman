<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Two radii and a pill. Nothing in Foreman has a shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:20px;align-items:flex-start}.box{width:110px;height:60px;background:var(--bg-card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--ink-1)}.n{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-2);margin-top:6px}.u{font-size:var(--fs-xs);color:var(--ink-1);margin-top:2px;max-width:150px}</style>
</head><body>
<div><div class="box" style="border-radius:var(--r-sm)">6px</div><div class="n">--r-sm</div><div class="u">Buttons, inputs, transcript cards, rows, wells</div></div>
<div><div class="box" style="border-radius:var(--r-md)">10px</div><div class="n">--r-md</div><div class="u">Project cards, modals, mission textarea</div></div>
<div><div class="box" style="border-radius:var(--r-pill);background:var(--bg-inset)">999px</div><div class="n">--r-pill</div><div class="u">Status badges, agent dots, meter track</div></div>
<div style="color:var(--ink-2);font-size:var(--fs-xs);max-width:170px">Depth is carried by four surface planes plus a 1px hairline. There is no shadow token because there are no shadows.</div>
</body></html>
